<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SeaSick · 3D sunlight test</title><style>body{margin:0;background:#17222e;color:#f1e8d7;font:17px/1.6 system-ui}main{max-width:1280px;margin:auto;padding:32px 20px}h1{margin:0;font-size:36px}p{max-width:850px;color:#c3ccd3}img{width:100%;display:block;border-radius:8px}button{padding:10px 18px;margin:6px 8px 12px 0;background:#344855;border:1px solid #627889;color:inherit;border-radius:6px;cursor:pointer}.frame{position:relative;--split:50%;overflow:hidden}.off{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--split)) 0 0)}input{width:100%}a{color:#f5c782}</style><main><h1>Volumetric sunlight · in game</h1><p>Matched Unity captures. Drag the slider: original lighting on the left, 3D atmosphere on the right. Island and ship shadows shape the light; the ocean retains its own colour and fog.</p><button onclick="view('shafts')">Toward the sun</button><button onclick="view('sunrise')">Sunrise</button><button onclick="view('noon')">Noon</button><button onclick="view('sunset')">Sunset</button><button onclick="view('night')">Night</button><button onclick="view('storm')">Storm</button><div class="frame"><img id="on" src="shafts-on.png" alt="Volumetric sunlight enabled"><img id="off" class="off" src="shafts-off.png" alt="Volumetric sunlight disabled"></div><input type="range" value="50" min="0" max="100" aria-label="Compare sunlight on and off" oninput="document.querySelector('.frame').style.setProperty('--split',this.value+'%')"><p><a href="validation.txt">Validation</a> · <a href="README.md">Settings and limitations</a></p></main><script>function view(i){document.querySelector('#on').src=i+'-on.png';document.querySelector('#off').src=i+'-off.png'}</script></html>
