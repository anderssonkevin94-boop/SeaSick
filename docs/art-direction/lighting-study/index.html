<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SeaSick · Lighting comparison</title>
<style>body{margin:0;background:#102734;color:#f0eadc;font:16px/1.6 system-ui}main{max-width:1440px;margin:auto;padding:36px 24px}h1{font-size:38px;margin:0}p{color:#bacecf;max-width:840px}section{margin:36px 0}h2{font-size:20px;font-weight:500}.frame{position:relative;overflow:hidden;border-radius:8px;--split:50%}.frame img{width:100%;display:block}.frame .before{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--split)) 0 0)}.line{position:absolute;left:var(--split);top:0;bottom:0;border-left:2px solid white;pointer-events:none}.label{position:absolute;top:12px;background:#102734cc;padding:5px 12px;border-radius:4px;font-size:13px}.left{left:12px}.right{right:12px}input{width:100%;accent-color:#efd19a;margin:16px 0}.portrait{max-width:500px}a{color:#9edcde}</style>
<main><h1>Warmer sun. Cooler shade.</h1><p>Matched in-game views at the same time of day. Drag each slider to compare the saved lighting on the left with the new lighting on the right. The new profile uses a lower sun, cooler ambient fill and clearer nearby air.</p>
<div id="views"></div><p><a href="validation.txt">Validation</a> · <a href="README.md">Saved settings and implementation</a></p></main>
<script>for(const [name,title] of [['home','Home island'],['ship','From the ship'],['shore','Near the shore'],['ship-portrait','Portrait view']]){const s=document.createElement('section');if(name.includes('portrait'))s.className='portrait';s.innerHTML=`<h2>${title}</h2><div class="frame"><img src="${name}-after.png" alt="${title}, new lighting"><img class="before" src="${name}-before.png" alt="${title}, previous lighting"><span class="line"></span><span class="label left">Saved lighting</span><span class="label right">New lighting</span></div><input aria-label="${title}: comparison position" type="range" min="0" max="100" value="50">`;s.querySelector('input').oninput=e=>s.querySelector('.frame').style.setProperty('--split',e.target.value+'%');document.querySelector('#views').append(s)}</script></html>
